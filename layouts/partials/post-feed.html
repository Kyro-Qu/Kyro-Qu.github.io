{{ $posts := .posts }}
{{ $initialCount := .initialCount }}
{{ $showLoadMore := .showLoadMore }}

<div class="posts-list" id="posts-container">
  {{ range first $initialCount $posts }}
  {{ partial "post-list-item.html" . }}
  {{ end }}
</div>

{{ if and $showLoadMore (gt (len $posts) $initialCount) }}
<div class="load-more-section">
  <button
    id="load-more-btn"
    class="load-more-btn"
    data-loaded="{{ $initialCount }}"
    data-total="{{ len $posts }}"
  >
    <span class="load-more-text">加载更多文章</span>
    <span class="load-more-icon">&#9749;</span>
  </button>
  <div class="load-more-loading" id="load-more-loading" style="display: none">
    <span class="loading-text">正在加载更多内容...</span>
    <div class="loading-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>
{{ end }}
