{{ with .Site.Params.giscus }}
  {{ if and .enabled (eq $.Section "posts") }}
    {{ if and .repo .repoId .category .categoryId }}
    <section
      class="comments-section"
      aria-labelledby="comments-heading"
      data-giscus-theme-light="light"
      data-giscus-theme-dark="transparent_dark"
    >
      <div class="comments-shell">
        <div class="comments-head">
          <div class="comments-heading-group">
            <p class="comments-kicker">GitHub Discussions</p>
            <h3 class="comments-title" id="comments-heading">评论区</h3>
          </div>
          <p class="comments-helper">使用 GitHub 登录，欢迎友好交流。</p>
        </div>
        <div class="comments-embed">
          <script
            src="https://giscus.app/client.js"
            data-repo="{{ .repo }}"
            data-repo-id="{{ .repoId }}"
            data-category="{{ .category }}"
            data-category-id="{{ .categoryId }}"
            data-mapping="{{ .mapping }}"
            data-strict="{{ if .strict }}1{{ else }}0{{ end }}"
            data-reactions-enabled="{{ if .reactionsEnabled }}1{{ else }}0{{ end }}"
            data-emit-metadata="{{ if .emitMetadata }}1{{ else }}0{{ end }}"
            data-input-position="{{ .inputPosition }}"
            data-theme="transparent_dark"
            data-lang="{{ .lang }}"
            data-loading="{{ .loading }}"
            crossorigin="anonymous"
            async
          ></script>
        </div>
      </div>
    </section>
    {{ else }}
    <!-- Giscus is wired in the theme, but repoId/categoryId are still missing. -->
    {{ end }}
  {{ end }}
{{ end }}
