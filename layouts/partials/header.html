<header class="site-header">
    <nav>
        <div class="nav-left">
            <a href="{{ "/" | absLangURL }}" class="logo">{{ partial "site-brand.html" . }}</a>
        </div>

        <div class="nav-links" id="siteNavLinks">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | absLangURL }}" class="nav-link">{{ .Name }}</a>
            {{ end }}
            {{ with .Site.Home.OutputFormats.Get "RSS" }}
            <a href="{{ "/subscribe/" | absLangURL }}" class="nav-link" title="RSS 订阅">订阅</a>
            {{ end }}
        </div>

        <div class="header-controls">
            <button class="mobile-menu-toggle" type="button" title="打开导航菜单" aria-label="打开导航菜单" aria-expanded="false" aria-controls="siteNavLinks">
                <span aria-hidden="true">&#9776;</span>
            </button>
            <button class="search-toggle" type="button" title="搜索文章" aria-label="搜索文章"><span aria-hidden="true">&#128269;</span></button>
            <button class="theme-toggle" type="button" title="切换明暗主题" aria-label="切换明暗主题"><span aria-hidden="true">&#127769;</span></button>
        </div>
    </nav>

    <div class="search-form-container" id="searchForm">
        <div class="search-form">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="搜索文章..." autocomplete="off">
                <button class="search-submit" type="button" aria-label="提交搜索">
                    <span aria-hidden="true">&#128269;</span>
                </button>
                <button class="search-close" type="button" aria-label="关闭搜索">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>
</header>
