{{ $image := .Site.Params.author.image | default "images/profile-320.png" }}
<img
  src="{{ $image | absURL }}"
  srcset="{{ "images/profile-160.png" | absURL }} 160w, {{ "images/profile-320.png" | absURL }} 320w"
  sizes="32px"
  alt="{{ .Site.Title }}"
  class="site-brand-avatar"
  width="32"
  height="32"
  loading="eager"
  decoding="async"
/>
<span class="site-brand-text">{{ .Site.Title }}</span>
