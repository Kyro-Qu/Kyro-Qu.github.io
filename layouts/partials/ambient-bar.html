<div class="ambient-bar">
    <div class="ambient-controls">
        <button class="mute-toggle muted" type="button" title="切换背景音效" aria-label="切换背景音效">
            <i class="fas fa-volume-mute" aria-hidden="true"></i>
        </button>
        <button class="ambient-icon" type="button" data-sound="coffee" title="咖啡馆音效" aria-label="咖啡馆音效">
            <i class="fas fa-coffee" aria-hidden="true"></i>
        </button>
        <button class="ambient-icon" type="button" data-sound="rain" title="雨声音效" aria-label="雨声音效">
            <i class="fas fa-cloud-rain" aria-hidden="true"></i>
        </button>
        <button class="ambient-icon" type="button" data-sound="fireplace" title="壁炉音效" aria-label="壁炉音效">
            <i class="fas fa-fire" aria-hidden="true"></i>
        </button>
    </div>

    <div class="ambient-label">选择背景音效</div>

    <div class="volume-container">
        <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="{{ .Site.Params.ambient_sounds.default_volume }}" aria-label="背景音量">
        <div class="equalizer muted" aria-hidden="true">
            {{ range (seq 8) }}
            <div class="equalizer-bar"></div>
            {{ end }}
        </div>
    </div>
</div>
