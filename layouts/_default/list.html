{{ define "main" }}
{{ $posts := .Pages.ByDate.Reverse }}
<div class="container">
  <section class="list-page-header">
    <p class="list-page-kicker">列表页</p>
    <h1 class="list-page-title">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="list-page-description">
      {{ . }}
    </div>
    {{ end }}
  </section>

  {{ partial "post-feed.html" (dict "posts" $posts "initialCount" (len $posts)
  "showLoadMore" false) }}
</div>
{{ end }}
