{{ define "main" }}
{{ $posts := where .Site.RegularPages "Section" "eq" "posts" }}
<div class="container">
  {{ if .Content }}
  <section class="home-intro-card">
    {{ .Content }}
  </section>
  {{ end }}

  {{ partial "post-feed.html" (dict "posts" $posts "initialCount" 3 "showLoadMore" true) }}
</div>
{{ end }}
