{{ define "main" }}

  <section class="home-intro-card">
    <div class="home-intro-shell">
      <p class="home-intro-kicker">WELCOME</p>
      <h1 class="home-intro-title">欢迎来到 Kyro Blog</h1>
      <p class="home-intro-lead">这里记录编程、学习和项目实践中的过程、问题与结果。</p>
    </div>
  </section>

  {{ partial "post-feed.html" (dict "posts" $posts "initialCount" 3 "showLoadMore" true) }}
</div>
{{ end }}
