name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Cache Hugo binary
        id: cache-hugo
        uses: actions/cache@v6
        with:
          path: ~/hugo-bin
          key: hugo-${{ env.HUGO_VERSION }}-linux-amd64

      - name: Install Hugo
        run: |
          if [ ! -x ~/hugo-bin/hugo ]; then
            mkdir -p ~/hugo-bin
            curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
            tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -C ~/hugo-bin hugo
          fi
          install -m 0755 ~/hugo-bin/hugo /usr/local/bin/hugo

      - name: Verify Hugo version
        run: hugo version

      - name: Build site
        run: |
          hugo \
            --gc \
            --minify \
            --buildFuture \
            --baseURL "https://kyroqu.xyz/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
