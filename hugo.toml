baseURL = "https://kyro-qu.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "Kyro Blog"
theme = "loficode"
enableEmoji = true

[outputs]
  home = ["HTML", "RSS", "JSON", "pages"]
  page = ["HTML"]
  section = ["HTML"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

[outputFormats.pages]
  mediaType = "application/json"
  baseName = "pages"
  isPlainText = true

[pagination]
  pagerSize = 6
  path = "page"

[params]
  description = "Kyro 的 Hugo 博客，记录编程、学习和项目实践。"
  tagline = "记录编程、学习和正在构建的东西"

[params.author]
  name = "Kyro"
  image = "images/profile.svg"

[params.social]
  github = "https://github.com/Kyro-Qu"

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "联系"
  url = "/contact/"
  weight = 20

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 30

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  includeNewer = true
  threshold = 20
  toLower = false

[[related.indices]]
  name = "tags"
  weight = 100

[[related.indices]]
  name = "date"
  weight = 10
