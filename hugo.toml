baseURL = "https://kyroqu.xyz/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "Kyro Blog"
enableEmoji = true
enableRobotsTXT = true

# 显式声明 mounts 以替代 theme = "loficode"：
# - 排除主题音频（环境音效已停用，避免 ~3.5MB 死重发布）
# - 主题 css/js 不再直接发布，而是挂载到 assets 走 Hugo Pipes（minify + fingerprint）
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.imports]]
    path = "loficode"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
      files = ["!audio/**", "!css/**", "!js/**"]
    [[module.imports.mounts]]
      source = "static/css"
      target = "assets/css"

[outputs]
  home = ["HTML", "RSS", "JSON", "pages"]
  page = ["HTML"]
  section = ["HTML"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

[outputFormats.pages]
  mediaType = "application/json"
  baseName = "pages"
  isPlainText = true

[pagination]
  pagerSize = 6
  path = "page"

[params]
  description = "Kyro Blog built with Hugo, focused on coding, learning, and project notes."
  tagline = "怀揣无限好奇心，在广阔世界中<br>不断探索前行。"
  defaultImage = "images/og/default.png"

[params.giscus]
  enabled = true
  repo = "Kyro-Qu/blog-comments"
  category = "Announcements"
  repoId = "R_kgDOSiIgzg"
  categoryId = "DIC_kwDOSiIgzs4C9Zeo"
  mapping = "pathname"
  strict = true
  reactionsEnabled = true
  emitMetadata = false
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = "lazy"

[params.author]
  name = "Kyro"
  image = "images/profile.png"

[params.social]
  github = "https://github.com/Kyro-Qu"
  twitter = "https://x.com/ShiChao_Qu"
  xHandle = "@ShiChao_Qu"
  qq = "https://qm.qq.com/cgi-bin/qm/qr?k=lsdR_o7GkoOFEa6mVNJKXmv9ayiISKnY"

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "归档"
  url = "/archive/"
  weight = 20

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 25

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      inline = [['$', '$'], ['\\(', '\\)']]
      block = [['$$', '$$'], ['\\[', '\\]']]

[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  includeNewer = true
  threshold = 20
  toLower = false

[[related.indices]]
  name = "tags"
  weight = 100

[[related.indices]]
  name = "date"
  weight = 10
