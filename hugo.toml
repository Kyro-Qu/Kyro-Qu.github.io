baseURL = "https://kyro-qu.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "Kyro Blog"
theme = "loficode"
enableEmoji = true
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON", "pages"]
  page = ["HTML"]
  section = ["HTML"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

[outputFormats.pages]
  mediaType = "application/json"
  baseName = "pages"
  isPlainText = true

[pagination]
  pagerSize = 6
  path = "page"

[params]
  description = "Kyro Blog built with Hugo, focused on coding, learning, and project notes."
  tagline = "Building, learning, and shipping."

[params.giscus]
  enabled = true
  repo = "Kyro-Qu/blog-comments"
  category = "Announcements"
  repoId = "R_kgDOSiIgzg"
  categoryId = "DIC_kwDOSiIgzs4C9Zeo"
  mapping = "pathname"
  strict = true
  reactionsEnabled = true
  emitMetadata = false
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = "lazy"

[params.author]
  name = "Kyro"
  image = "images/profile.png"

[params.social]
  github = "https://github.com/Kyro-Qu"
  twitter = "https://x.com/Jaquyu1"

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "归档"
  url = "/archive/"
  weight = 20

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 25

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      inline = [['$', '$'], ['\\(', '\\)']]
      block = [['$$', '$$'], ['\\[', '\\]']]

[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  includeNewer = true
  threshold = 20
  toLower = false

[[related.indices]]
  name = "tags"
  weight = 100

[[related.indices]]
  name = "date"
  weight = 10
